services:
  - type: web
    name: meal-plan-generator
    env: python
    root: backend
    pythonVersion: "3.13.4"
    buildCommand: "python -m pip install -r requirements.txt && cp ../meals.json . || echo 'Meals.json copy failed, will use parent path'"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    autoDeploy: true
